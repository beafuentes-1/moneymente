<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyMente</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="nav"><div class="brand"><svg class="brand-logo" viewBox="0 0 40 40" role="img" data-i18n-aria="aria_brand_logo"><defs><linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-gold)"/><stop offset="1" stop-color="var(--cyber-cyan)"/></linearGradient></defs><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="color-mix(in srgb,var(--accent-gold) 12%,var(--bg-card))" stroke="url(#brand-g)" stroke-width="2.5"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="var(--accent-gold)" stroke-width="1.2" stroke-dasharray="4 2.5" opacity=".85"/><path d="M12 25l5-6 4 3 7-9" fill="none" stroke="var(--accent-gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="13" r="2.5" fill="var(--cyber-cyan)"/></svg><div><b data-i18n="title"></b><small data-i18n="tag"></small></div></div>
<nav id="tabs"><button data-tab="overview" data-i18n="n_overview"></button><button data-tab="numbers" data-i18n="n_numbers"></button><button data-tab="goals" data-i18n="n_goals"></button><button data-tab="year" data-i18n="n_year"></button><button data-tab="report" data-i18n="n_report"></button></nav>
<div class="tools"><details class="vmenu"><summary data-i18n-aria="aria_settings">⚙️</summary><div class="pop"><h2 data-i18n="settings"></h2><label class="vc"><span data-i18n="appearance"></span><select id="theme"><option value="system" data-i18n="theme_system"></option><option value="light" data-i18n="theme_light"></option><option value="dark" data-i18n="theme_dark"></option></select></label><label><span data-i18n="currency"></span><select id="currency"><option value="USD">USD — $</option><option value="MXN">MXN — $</option><option value="CAD">CAD — $</option><option value="EUR">EUR — €</option><option value="GBP">GBP — £</option></select></label><small data-i18n="currency_display_only"></small><button id="tour" class="btn" data-i18n="tour"></button>
<label class="vc"><span data-i18n="voice"></span><select id="voice"></select></label><label class="vc"><span data-i18n="rate"></span><input id="rate" type="range" min="0.7" max="1.3" step="0.1" value="1"></label></div></details>
<select id="lang" data-i18n-aria="aria_language"><option value="en">English</option><option value="es">Español</option></select></div></header>
<main>
<section data-view="overview" class="on"><div class="hero">
<article id="score" class="card glow"><div class="hd"><h2 data-i18n="score_t"></h2><button class="ghost" id="quiz-btn" data-i18n="q_btn"></button></div><p id="scoreSource" class="mu"></p><div id="quiz-banner"></div><div id="gauge"></div><ul id="parts" class="meters"></ul><small id="scoreMath"></small><div id="quiz-box" class="qbox" hidden></div></article>
<div class="stack"><article id="next" class="card accent"></article><article id="ins" class="card"></article></div></div>
<div id="kpis"></div>
<article id="plan" class="card"><div class="hd"><h2 data-i18n="plan_t"></h2><button class="ghost" data-tab="year" data-i18n="p_open_yr"></button></div><ol id="steps" class="timeline"></ol><div id="plan-hub" class="two plan-hub"></div></article></section>
<section data-view="numbers"><div class="two"><div class="stack">
<article class="card"><div class="hd"><h2 data-i18n="num_in"></h2><span><button class="ghost" id="demo" data-i18n="demo"></button> <button class="ghost" id="restore-demo" data-i18n="demo_restore" hidden></button> <button class="ghost" id="reset" data-i18n="reset"></button></span></div><p id="demo-notice" class="demo-notice" data-i18n="demo_label" hidden></p>
<div class="grid3"><label class="f"><span data-i18n="income"></span><input data-b="income" id="income" type="number" min="0"></label><label class="f"><span data-i18n="savings"></span><input data-b="savings" id="savings" type="number" min="0"></label><label class="f"><span data-i18n="invested"></span><input data-b="invested" id="invested" type="number" min="0"></label></div>
<h3 data-i18n="debts"></h3><div id="debts"></div><button class="btn" data-add="debts" data-i18n="addDebt"></button></article>
<article id="debtsim" class="card"><h2 data-i18n="num_ds"></h2><label class="f"><span data-i18n="extra"></span><input data-b="extra" id="extra" type="number" min="0"></label><div id="dres" class="two"></div><canvas id="dc" width="800" height="260"></canvas></article></div>
<div class="stack"><article class="card"><div class="hd"><h2 data-i18n="b_in"></h2><span class="num"><small data-i18n="etot"></small> <b id="etot"></b></span></div><div id="cats"></div><button class="btn" data-add="cats" data-i18n="addCat"></button></article>
<article class="card" id="bchart"></article></div></div></section>
<section data-view="goals"><div class="two"><div class="stack">
<article class="card"><div class="hd"><h2 data-i18n="g_t"></h2><button class="btn" data-add="goals" data-i18n="g_add"></button></div><div id="goals"></div></article>
<article class="card"><h2 data-i18n="g_gap"></h2><canvas id="gb" width="800" height="200"></canvas></article></div>
<div class="stack"><article class="card"><div class="hd"><h2 data-i18n="scen_t"></h2><select id="gsel" data-i18n-aria="aria_goal"></select></div><canvas id="gc" width="800" height="320"></canvas><small data-i18n="scen_note"></small></article>
<article class="card"><h2 data-i18n="ret_t"></h2><div id="retctl"></div><canvas id="rc" width="800" height="300"></canvas><p id="retfin" class="hl"></p></article></div></div></section>
<section data-view="year"><div class="two"><div class="stack">
<article class="card"><div class="hd"><h2 data-i18n="y_sp"></h2><button class="btn" data-add="special" data-i18n="y_add"></button></div><small data-i18n="y_sp_note"></small><div id="special"></div></article>
<article class="card"><div class="hd"><h2 data-i18n="y_hist"></h2><div class="acts"><select id="lyr" data-i18n-aria="aria_year"></select><button class="ghost" id="lfill" data-i18n="y_fill"></button></div></div><small data-i18n="y_hh"></small><div id="lsum" class="hl"></div><div id="hist"></div></article></div>
<div class="stack"><article class="card"><div class="hd"><h2 data-i18n="y_t"></h2><div class="acts"><label class="f-inl"><span data-i18n="y_hor"></span><select id="yhor"></select></label><label class="f-inl"><span data-i18n="y_incg"></span><input id="yincg" type="number" min="0" max="25" step="0.5" style="width:64px"></label><label class="f-inl"><span data-i18n="y_inf"></span><input id="yinf" type="number" min="0" max="25" step="0.5" style="width:64px"></label></div></div><canvas id="yc" width="800" height="340"></canvas><div id="ysum"></div><div id="ymulti"></div></article>
<article class="card"><h2 data-i18n="y_hist_ch"></h2><canvas id="hc" width="800" height="300"></canvas></article></div></div></section>
<section data-view="report"><div class="hd rbar"><h2 data-i18n="r_t"></h2><div class="acts"><button class="ghost" id="aisum" data-i18n="r_ai"></button><button class="btn" id="print" data-i18n="r_print"></button></div></div><article id="report"></article></section>
</main>
<footer data-i18n="disc"></footer>
<aside id="chat" hidden role="dialog" data-i18n-aria="aria_buck"><div class="ch"><b data-i18n="chat_t"></b><span id="ai-st" class="st"></span><label class="ch-opt" id="thk-lbl"><input type="checkbox" id="think"> 🧠</label><label class="ch-opt"><input type="checkbox" id="auto"> 🔊</label><button id="close" class="x" data-i18n-aria="aria_close">✕</button></div>
<div id="msgs"></div><div id="chips"></div><div class="send"><input id="q" autocomplete="off"><button id="send" class="btn" data-i18n="send"></button></div></aside>
<div id="bubble" hidden></div>
<button id="pet" data-i18n-aria="aria_buck"><svg viewBox="0 0 100 110" width="66" height="72"><defs><linearGradient id="pet-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#84cc16"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><radialGradient id="pet-core" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#192b36"/><stop offset="100%" stop-color="#070d12"/></radialGradient></defs><ellipse cx="50" cy="104" rx="26" ry="4.5" fill="#84cc16" opacity=".28"/>
<ellipse cx="50" cy="52" rx="47" ry="18" fill="none" stroke="url(#pet-g)" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-16 50 52)"/>
<polygon points="50,8 88,30 88,74 50,96 12,74 12,30" fill="url(#pet-core)" stroke="url(#pet-g)" stroke-width="3"/>
<circle cx="50" cy="52" r="31" fill="none" stroke="#84cc16" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
<rect x="24" y="30" width="52" height="20" rx="10" fill="#04080c" stroke="url(#pet-g)" stroke-width="2"/>
<g class="eyes"><circle cx="38" cy="40" r="4.8" fill="#84cc16"/><circle cx="62" cy="40" r="4.8" fill="#84cc16"/><circle cx="39.5" cy="38.5" r="1.6" fill="#fff"/><circle cx="63.5" cy="38.5" r="1.6" fill="#fff"/></g>
<rect class="mouth" x="41" y="55" width="18" height="3.6" rx="1.8" fill="#06b6d4"/>
<text x="50" y="83" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="800" font-size="24" fill="#84cc16">$</text></svg></button>
<script src="js/engine.js"></script><script src="js/charts.js"></script><script src="js/app.js"></script><script src="js/chat.js"></script></body></html>
