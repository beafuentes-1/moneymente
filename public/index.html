<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Roadmap</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1 data-i18n="title"></h1><div class="bar"><button id="tour" data-i18n="tour"></button>
<select id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select></div></header>
<main>
<section id="profile" class="card"><h2 data-i18n="p_h"></h2><div class="grid">
<label><span data-i18n="income"></span><input id="income" type="number" min="0" value="1000"></label>
<label><span data-i18n="expenses"></span><input id="expenses" type="number" min="0" value="800"></label>
<label><span data-i18n="savings"></span><input id="savings" type="number" min="0" value="0"></label>
<label><span data-i18n="invested"></span><input id="invested" type="number" min="0" value="0"></label>
<label><span data-i18n="goal"></span><input id="goal" type="number" min="0" value="0"></label></div>
<h3 data-i18n="debts"></h3><div id="debts"></div><button id="addDebt" data-i18n="addDebt"></button></section>
<section id="map" class="card"><div id="xp"></div><div class="track"><div id="fill"></div></div><ol id="levels"></ol></section>
<section id="level" class="card" aria-live="polite"></section>
</main><footer data-i18n="disc"></footer>
<script src="js/engine.js"></script><script src="js/app.js"></script></body></html>
